<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690" role="img" aria-labelledby="t d"><title id="t">Topology-disjoint train and evaluation split</title><desc id="d">All fitting uses original topology T0. Four unseen families are separately evaluated with 40 topologies and 40,000 OOD operating points.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#12334a"/></linearGradient><style>.h{font:700 32px Arial;fill:#f8fafc}.s{font:500 18px Arial;fill:#a8c5d6}.th{font:700 24px Arial;fill:#f8fafc}.tx{font:500 18px Arial;fill:#d6e3eb}.sm{font:500 15px Arial;fill:#a8c5d6}.p{fill:#0b2032;stroke:#34708a;stroke-width:2}.o{fill:#302b24;stroke:#f59e0b;stroke-width:2}.tr{fill:#123b43;stroke:#2dd4bf;stroke-width:2}</style></defs><rect width="1500" height="690" rx="24" fill="url(#b)"/><text x="65" y="75" class="h">The split is by network structure, not just operating point</text><text x="65" y="110" class="s">The original topology is the only graph seen during model fitting.</text><rect x="70" y="165" width="390" height="370" rx="20" class="p"/><text x="105" y="210" class="th">Original topology · T0</text><g stroke="#67e8f9" stroke-width="3" fill="none"><path d="M130 310L200 270L280 310L350 275L390 345L335 405L255 390L190 440L130 390Z M200 270L205 475L280 500L335 405M255 390L255 500"/></g><g fill="#fbbf24"><circle cx="130" cy="310" r="8"/><circle cx="200" cy="270" r="8"/><circle cx="280" cy="310" r="8"/><circle cx="350" cy="275" r="8"/><circle cx="390" cy="345" r="8"/><circle cx="335" cy="405" r="8"/><circle cx="255" cy="390" r="8"/><circle cx="190" cy="440" r="8"/></g><text x="105" y="490" class="tx">20,000 train · 3,000 validation</text><text x="105" y="520" class="tx">3,000 IID test operating points</text><path d="M465 345H525" stroke="#67e8f9" stroke-width="4" fill="none"/><rect x="535" y="165" width="900" height="370" rx="20" class="p"/><text x="575" y="210" class="th">Strictly held-out topology families</text><g><rect x="575" y="260" width="180" height="190" rx="14" class="o"/><text x="605" y="305" class="th">T1 · N-1</text><text x="605" y="347" class="tx">10 retained</text><text x="605" y="378" class="tx">topologies</text><text x="605" y="420" class="sm">10,000 points</text><rect x="785" y="260" width="180" height="190" rx="14" class="o"/><text x="815" y="305" class="th">T2 · N-2</text><text x="815" y="347" class="tx">10 retained</text><text x="815" y="378" class="tx">topologies</text><text x="815" y="420" class="sm">10,000 points</text><rect x="995" y="260" width="180" height="190" rx="14" class="o"/><text x="1025" y="305" class="th">T3 · ~5%</text><text x="1025" y="347" class="tx">10 retained</text><text x="1025" y="378" class="tx">topologies</text><text x="1025" y="420" class="sm">10,000 points</text><rect x="1205" y="260" width="180" height="190" rx="14" class="o"/><text x="1235" y="305" class="th">T4 · ~10%</text><text x="1235" y="347" class="tx">10 retained</text><text x="1235" y="378" class="tx">topologies</text><text x="1235" y="420" class="sm">10,000 points</text></g><text x="575" y="500" class="sm">Fresh operating points · independent generation · no OOD hyperparameter tuning</text><rect x="70" y="575" width="1365" height="65" rx="14" class="tr"/><text x="110" y="617" class="th">40 held-out topology instances × 1,000 points = 40,000 OOD evaluation points</text></svg>