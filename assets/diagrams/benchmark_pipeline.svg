<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Topology-disjoint PSSE benchmark pipeline</title><desc id="desc">55 bus system, topology disjoint training and OOD test, six estimators, and evaluation dimensions.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102b40"/></linearGradient><style>.h{font:700 31px Arial;fill:#f8fafc}.t{font:700 22px Arial;fill:#f8fafc}.b{font:500 17px Arial;fill:#c8d9e3}.s{font:500 14px Arial;fill:#9fb7c7}.p{fill:#0c2234;stroke:#25647a;stroke-width:2}.q{fill:#102f45;stroke:#2c7a8f;stroke-width:1.5}.a{stroke:#67e8f9;stroke-width:4;fill:none}</style><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#67e8f9"/></marker></defs><rect width="1600" height="900" rx="24" fill="url(#bg)"/><text x="65" y="75" class="h">Topology-disjoint benchmark: from network to reliability evidence</text><text x="65" y="110" class="b">One training topology · unseen structural configurations · shared measurement budget · paired evaluation</text><rect x="60" y="170" width="300" height="570" rx="20" class="p"/><text x="90" y="215" class="t">55-bus system</text><text x="90" y="250" class="b">Graph G=(V,E), measurements z</text><g stroke="#67e8f9" stroke-width="3" fill="none"><path d="M110 350L170 300L240 340L300 300L325 390L270 450L205 420L145 485L100 420Z M170 300L175 560L240 590L270 450 M205 420L205 620"/></g><g fill="#fbbf24"><circle cx="110" cy="350" r="8"/><circle cx="170" cy="300" r="8"/><circle cx="240" cy="340" r="8"/><circle cx="300" cy="300" r="8"/><circle cx="325" cy="390" r="8"/><circle cx="270" cy="450" r="8"/><circle cx="205" cy="420" r="8"/><circle cx="145" cy="485" r="8"/><circle cx="100" cy="420" r="8"/></g><text x="90" y="670" class="b">55 buses · 27 lines · 27 transformers</text><text x="90" y="705" class="b">134 measurements · 109 states</text><path d="M365 450H420" class="a" marker-end="url(#ar)"/><rect x="430" y="170" width="420" height="570" rx="20" class="p"/><text x="465" y="215" class="t">Topology-disjoint split</text><rect x="465" y="250" width="350" height="95" rx="14" class="q"/><text x="490" y="288" class="t">T0 · original topology</text><text x="490" y="320" class="b">20k train · 3k val · 3k IID test</text><text x="465" y="395" class="b">Held-out OOD families</text><g><rect x="465" y="430" width="160" height="95" rx="12" class="q"/><text x="485" y="470" class="t">T1 · N-1</text><text x="485" y="500" class="b">10 × 1,000</text><rect x="650" y="430" width="165" height="95" rx="12" class="q"/><text x="670" y="470" class="t">T2 · N-2</text><text x="670" y="500" class="b">10 × 1,000</text><rect x="465" y="555" width="160" height="95" rx="12" class="q"/><text x="485" y="595" class="t">T3 · ~5%</text><text x="485" y="625" class="b">10 × 1,000</text><rect x="650" y="555" width="165" height="95" rx="12" class="q"/><text x="670" y="595" class="t">T4 · ~10%</text><text x="670" y="625" class="b">10 × 1,000</text></g><text x="465" y="700" class="t">40 topologies · 40,000 OOD points</text><path d="M855 450H900" class="a" marker-end="url(#ar)"/><rect x="910" y="170" width="270" height="570" rx="20" class="p"/><text x="945" y="215" class="t">Six estimators</text><g><rect x="945" y="260" width="205" height="52" rx="10" class="q"/><text x="970" y="294" class="b">WLS-node</text><rect x="945" y="325" width="205" height="52" rx="10" class="q"/><text x="970" y="359" class="b">MLP</text><rect x="945" y="390" width="205" height="52" rx="10" class="q"/><text x="970" y="424" class="b">GCN</text><rect x="945" y="455" width="205" height="52" rx="10" class="q"/><text x="970" y="489" class="b">GraphSAGE</text><rect x="945" y="520" width="205" height="52" rx="10" class="q"/><text x="970" y="554" class="b">GAT</text><rect x="945" y="585" width="205" height="75" rx="10" fill="#123b43" stroke="#2dd4bf" stroke-width="2"/><text x="970" y="620" class="t">Physics-GAT</text><text x="970" y="645" class="s">GAT + residual</text></g><text x="945" y="700" class="s">Shared primary measurement information</text><path d="M1185 450H1225" class="a" marker-end="url(#ar)"/><rect x="1235" y="170" width="300" height="570" rx="20" class="p"/><text x="1270" y="215" class="t">Evaluation evidence</text><g class="b"><text x="1270" y="290">State error</text><text x="1270" y="320" class="s">Voltage / angle RMSE, MAE</text><text x="1270" y="390">Physical consistency</text><text x="1270" y="420" class="s">P/Q mismatch, residuals</text><text x="1270" y="490">Topology-distance trend</text><text x="1270" y="520" class="s">OOD ratios, slopes, rho</text><text x="1270" y="590">Observability</text><text x="1270" y="620" class="s">Jacobian rank / conditioning</text><text x="1270" y="690">Paired statistics · 5 seeds</text></g><text x="65" y="820" class="b">Scientific focus: quantify when IID interpolation stops predicting reliability on unseen electrical topologies.</text><text x="65" y="855" class="s">Paper-reported protocol · schematic illustration; branch identities are not encoded.</text></svg>