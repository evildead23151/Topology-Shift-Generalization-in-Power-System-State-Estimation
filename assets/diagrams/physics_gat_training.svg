<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="t d"><title id="t">Physics-GAT conceptual training architecture</title><desc id="d">Graph and measurement inputs feed GAT and state head. Predicted states pass through the topology-specific measurement model. The weighted residual joins state loss to form the total objective.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#102b40"/></linearGradient><style>.h{font:700 31px Arial;fill:#f8fafc}.sub{font:500 18px Arial;fill:#a8c5d6}.th{font:700 23px Arial;fill:#f8fafc}.tx{font:500 17px Arial;fill:#d6e3eb}.sm{font:500 14px Arial;fill:#a8c5d6}.p{fill:#0b2032;stroke:#34708a;stroke-width:2}.c{fill:#123b43;stroke:#2dd4bf;stroke-width:2}.a{fill:#332c1e;stroke:#fbbf24;stroke-width:2}.ar{stroke:#67e8f9;stroke-width:4;fill:none}.ag{stroke:#fbbf24;stroke-width:3;fill:none}</style></defs><rect width="1600" height="780" rx="24" fill="url(#bg)"/><text x="65" y="74" class="h">Physics-GAT · state prediction coupled to the measurement model</text><text x="65" y="110" class="sub">Conceptual objective from the manuscript; exact implementation internals are not inferred.</text><rect x="65" y="210" width="230" height="170" rx="16" class="p"/><text x="95" y="255" class="th">Inputs</text><text x="95" y="300" class="tx">Graph G=(V,E)</text><text x="95" y="335" class="tx">Measurements z</text><path d="M300 295H355" class="ar"/><rect x="365" y="210" width="260" height="170" rx="16" class="c"/><text x="400" y="255" class="th">GAT encoder</text><g stroke="#67e8f9" stroke-width="2.6" fill="none"><path d="M420 310L470 285L515 315L560 285L590 325L535 350L475 340Z"/></g><g fill="#fbbf24"><circle cx="420" cy="310" r="7"/><circle cx="470" cy="285" r="7"/><circle cx="515" cy="315" r="7"/><circle cx="560" cy="285" r="7"/><circle cx="590" cy="325" r="7"/><circle cx="535" cy="350" r="7"/><circle cx="475" cy="340" r="7"/></g><text x="400" y="370" class="sm">Attention message passing</text><path d="M630 295H685" class="ar"/><rect x="695" y="210" width="220" height="170" rx="16" class="p"/><text x="730" y="255" class="th">State head</text><text x="730" y="300" class="tx">Predict x̂</text><text x="730" y="335" class="tx">V̂ and θ̂</text><path d="M920 295H975" class="ar"/><rect x="985" y="210" width="250" height="170" rx="16" class="a"/><text x="1015" y="255" class="th">Power-system model</text><text x="1015" y="300" class="tx">ẑ = h_G(x̂)</text><text x="1015" y="335" class="sm">Example topology G</text><path d="M1240 295H1295" class="ag"/><rect x="1305" y="210" width="230" height="170" rx="16" class="p"/><text x="1335" y="255" class="th">Residual</text><text x="1335" y="300" class="tx">r = ẑ − z</text><text x="1335" y="335" class="tx">rᵀWr</text><path d="M805 385V480H600V520" class="ar"/><path d="M1415 385V480H1085V520" class="ag"/><rect x="400" y="530" width="400" height="150" rx="16" class="c"/><text x="440" y="575" class="th">State loss</text><text x="440" y="620" class="tx">MSE(V,V̂) + α MSE(θ̂,θ)</text><rect x="875" y="530" width="420" height="150" rx="16" class="a"/><text x="915" y="575" class="th">Physics loss</text><text x="915" y="620" class="tx">mean[(h_G(x̂)−z)ᵀW(h_G(x̂)−z)]</text><path d="M800 605H1330" stroke="#67e8f9" stroke-width="3" stroke-dasharray="8 8" fill="none"/><rect x="1345" y="530" width="190" height="150" rx="16" class="p"/><text x="1380" y="575" class="th">Total loss</text><text x="1380" y="620" class="tx">L=L_state</text><text x="1380" y="650" class="tx">+ λL_phys</text><text x="65" y="735" class="sm">λ candidates: 1e-4, 1e-3, 1e-2, 1e-1, 1, 10; selection is validation-only.</text></svg>