name: Validate paper-reported artifacts

on:
  push:
    paths:
      - "data/paper_reported/**"
      - "scripts/**"
      - ".github/workflows/paper-reported-data.yml"
  pull_request:
    paths:
      - "data/paper_reported/**"
      - "scripts/**"
      - ".github/workflows/paper-reported-data.yml"
  workflow_dispatch:

jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_paper_data.py
      - run: python scripts/plot_paper_reported_results.py
